        required: false
        type: boolean
        default: false
      ref:
        description: "Git ref of dcc-mcp/.github that holds the check script."
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  matrix:
    name: Build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pairs: ${{ steps.build.outputs.pairs }}
      has_pairs: ${{ steps.build.outputs.has_pairs }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: dcc-mcp/.github
          ref: ${{ inputs.ref || 'main' }}
          sparse-checkout: scripts
          path: release-integrity

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the repository/package matrix
        id: build
        working-directory: release-integrity
        env:
          REPOSITORIES: ${{ inputs.repositories }}
        run: |
          python scripts/check_release_integrity.py --manifest "$REPOSITORIES" --emit-matrix > matrix.json
          python - <<'PY'
          import json
          import os

          with open("matrix.json", encoding="utf-8") as handle:
              pairs = json.load(handle)["include"]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("pairs=" + json.dumps({"include": pairs}) + "\n")
              handle.write("has_pairs=" + ("true" if pairs else "false") + "\n")
          PY

  compare:
    name: ${{ matrix.key }}
    needs: matrix
    if: needs.matrix.outputs.has_pairs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.pairs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: dcc-mcp/.github
          ref: ${{ inputs.ref || 'main' }}
          sparse-checkout: scripts
          path: release-integrity

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compare ${{ matrix.package }} with the latest release of ${{ matrix.repository }}
        working-directory: release-integrity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ matrix.repository }}
          PACKAGE: ${{ matrix.package }}
          GRACE_MINUTES: ${{ inputs.grace_minutes }}
          STRICT: ${{ inputs.strict }}
        run: |
          set -- --repository "$REPOSITORY" --package "$PACKAGE" --grace-minutes "$GRACE_MINUTES"
          if [[ "$STRICT" == "true" ]]; then
            set -- "$@" --strict
          fi
          python scripts/check_release_integrity.py "$@"
