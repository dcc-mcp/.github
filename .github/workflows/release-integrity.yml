          {"repository":"dcc-mcp/dcc-mcp-premiere","packages":["dcc-mcp-premiere"]},
          {"repository":"dcc-mcp/dcc-mcp-renderdoc","packages":["dcc-mcp-renderdoc"]},
          {"repository":"dcc-mcp/dcc-mcp-shogun","packages":["dcc-mcp-shogun"]},
          {"repository":"dcc-mcp/dcc-mcp-sketchup","packages":["dcc-mcp-sketchup"]},
          {"repository":"dcc-mcp/dcc-mcp-substance3d-designer","packages":["dcc-mcp-substance3d-designer"]},
