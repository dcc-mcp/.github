name: Release CI gate (nightly)

# Turns a silent failure into a visible one.
#
# A release pull request whose CI is parked in GitHub's approval queue shows no check
# runs at all, so nothing alerts: not the pull request page, not `gh pr checks`, not
# `mergeable`. This sweep runs the merge gate over every open release pull request in
# the organization once a day and fails whenever one of them would be merged without
# CI having run.

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # A reusable workflow cannot raise the permissions its caller was granted, so the
  # caller has to declare them or the called workflow runs with a token that cannot
  # read workflow runs or pull requests. Without these two lines the nightly sweep
  # gets 403, exits 2, and reports "could not be performed" every night instead of
  # listing the pull requests that are actually blocked - the alert becomes noise.
  actions: read
  pull-requests: read

concurrency:
  group: release-ci-gate-nightly
  cancel-in-progress: false

jobs:
  release-ci-gate:
    uses: ./.github/workflows/release-ci-gate.yml
